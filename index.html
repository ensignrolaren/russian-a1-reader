<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Рассказы</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%238c2f27'/%3E%3Ctext x='32' y='47' text-anchor='middle' font-family='Georgia, serif' font-size='44' fill='%23f0ece4'%3E%D0%A0%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bad+Script&family=PT+Sans&family=Caveat:wght@400..700&family=Marck+Script&family=Pacifico&display=swap">
<style>
:root {
	--paper: #e5e8e3;
	--panel: #eef0ec;
	--ink: #1b2620;
	--muted: #6d7a72;
	--print: #4a554e;
	--rule: #c9d0ca;
	--accent: #8c2f27;
}
body.night {
	--paper: #171d1a;
	--panel: #222a26;
	--ink: #e3e8e3;
	--muted: #8d9a92;
	--print: #9fada4;
	--rule: #2c352f;
	--accent: #d98b7f;
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
	margin: 0;
	background: var(--paper);
	color: var(--ink);
	font-family: Georgia, "Times New Roman", serif;
	font-size: 17px;
	display: grid;
	grid-template-columns: 16rem 1fr;
	min-height: 100vh;
}
#toc {
	position: sticky;
	inset: auto;
	top: 0;
	align-self: start;
	display: block;
	width: auto;
	max-width: none;
	height: auto;
	max-height: 100vh;
	margin: 0;
	padding: 2rem 1.2rem 3rem;
	border: 0;
	border-right: 1px solid var(--rule);
	overflow-y: auto;
	background: var(--panel);
	color: inherit;
}
#tochead {
	display: grid;
	grid-template-columns: 1fr auto;
	align-items: center;
	gap: 0.6rem 0.8rem;
	margin-bottom: 1rem;
}
#tochead h2 { margin: 0; }
#filter {
	grid-column: 1 / -1;
	width: 100%;
	padding: 0.35rem 0.5rem;
	border: 1px solid var(--rule);
	border-radius: 3px;
	background: var(--paper);
	font: inherit;
	font-size: 0.92rem;
	color: var(--ink);
}
#toc #close {
	display: none;
	align-items: center;
	justify-content: center;
	width: 2.2rem;
	height: 2.2rem;
	padding: 0;
	border: 1px solid var(--rule);
	border-radius: 50%;
	background: var(--paper);
	font-size: 1rem;
	line-height: 1;
	color: var(--ink);
	cursor: pointer;
}
#empty {
	margin: 0 0 1.6rem;
	font-size: 0.92rem;
	font-style: italic;
	color: var(--muted);
}
#bar { display: none; }
#toc h2 {
	margin: 0 0 1.2rem;
	font-size: 0.8rem;
	font-weight: 400;
	font-style: italic;
	letter-spacing: 0.12em;
	text-transform: uppercase;
	color: var(--muted);
}
#toc ol {
	margin: 0 0 1.6rem;
	padding: 0;
	list-style: none;
}
#toc button {
	display: block;
	width: 100%;
	margin: 0;
	padding: 0.35rem 0.5rem;
	border: 0;
	border-radius: 3px;
	background: none;
	font: inherit;
	font-size: 0.98rem;
	text-align: left;
	color: var(--ink);
	cursor: pointer;
}
#toc button:hover { background: var(--paper); }
#toc button[aria-current="true"] {
	background: var(--accent);
	color: var(--panel);
}
#toc button small {
	display: block;
	font-size: 0.78rem;
	font-style: italic;
	color: var(--muted);
}
#toc button[aria-current="true"] small { color: inherit; }
#tools {
	padding-top: 1.2rem;
	border-top: 1px solid var(--rule);
	display: grid;
	gap: 0.7rem;
}
main {
	padding: 7vh 6vw 14vh;
	max-width: 44rem;
}
h1 {
	margin: 0 0 0.1em;
	font-weight: 400;
	line-height: 1.45;
}
.sub {
	margin: 0 0 3rem;
	font-size: 1.05rem;
	font-style: italic;
	color: var(--muted);
}
#lines {
	margin: 0;
	padding: 0;
	list-style: none;
	max-width: 32rem;
}
#lines li + li { margin-top: 1.7rem; }
.ru {
	display: block;
	width: 100%;
	margin: 0;
	padding: 0;
	border: 0;
	background: none;
	font: inherit;
	text-align: left;
	color: inherit;
	cursor: pointer;
	transition: color 0.12s ease;
}
.cur {
	display: block;
	line-height: 1.95;
}
.prn {
	display: none;
	margin-top: 0.1rem;
	font-family: "PT Sans", Verdana, sans-serif;
	font-size: 1.05rem;
	line-height: 1.4;
	color: var(--print);
}
.en {
	display: none;
	margin: 0.4rem 0 0 1.4rem;
	padding-left: 0.9rem;
	border-left: 2px solid var(--rule);
	font-size: 1rem;
	line-height: 1.55;
	color: var(--muted);
}
li[data-stage="1"] .prn, li[data-stage="2"] .prn { display: block; }
li[data-stage="2"] .en { display: block; }
li[data-stage="2"] .cur { color: var(--accent); }
.ru:hover .cur { color: var(--accent); }
nav {
	max-width: 32rem;
	margin: 3.5rem 0 0;
	padding-top: 1.5rem;
	border-top: 1px solid var(--rule);
	display: flex;
	flex-wrap: wrap;
	align-items: center;
	gap: 1.6rem;
}
button.act {
	margin: 0;
	padding: 0;
	border: 0;
	background: none;
	font: inherit;
	font-size: 1rem;
	font-style: italic;
	color: var(--accent);
	text-decoration: underline;
	text-underline-offset: 4px;
	cursor: pointer;
}
select {
	width: 100%;
	padding: 0.3rem 0.4rem;
	border: 1px solid var(--rule);
	border-radius: 3px;
	background: var(--paper);
	font: inherit;
	font-size: 0.92rem;
	color: var(--ink);
}
#night {
	position: fixed;
	top: 1.1rem;
	right: 1.1rem;
	width: 2.2rem;
	height: 2.2rem;
	padding: 0;
	border: 1px solid var(--rule);
	border-radius: 50%;
	background: var(--panel);
	font-size: 1rem;
	line-height: 1;
	color: var(--ink);
	cursor: pointer;
}
#editor { max-width: 32rem; }
#draft {
	display: block;
	width: 100%;
	min-height: 12rem;
	padding: 1rem;
	border: 1px solid var(--rule);
	border-radius: 4px;
	background: var(--panel);
	font-family: "PT Sans", Verdana, sans-serif;
	font-size: 1.05rem;
	line-height: 1.6;
	color: var(--ink);
	resize: vertical;
}
[hidden] { display: none !important; }
:focus-visible {
	outline: 2px solid var(--accent);
	outline-offset: 3px;
}
@media (max-width: 44rem) {
	body {
		grid-template-columns: 1fr;
		grid-template-rows: auto 1fr;
	}
	#bar {
		position: sticky;
		top: 0;
		z-index: 5;
		display: flex;
		align-items: center;
		gap: 0.8rem;
		min-height: 3.4rem;
		padding: 0.5rem 3.6rem 0.5rem 0.9rem;
		border-bottom: 1px solid var(--rule);
		background: var(--panel);
	}
	#menu {
		flex: none;
		display: flex;
		align-items: center;
		gap: 0.45rem;
		min-height: 2.4rem;
		margin: 0;
		padding: 0.4rem 0.7rem;
		border: 1px solid var(--rule);
		border-radius: 3px;
		background: var(--paper);
		font: inherit;
		font-size: 0.95rem;
		color: var(--ink);
		cursor: pointer;
	}
	#barTitle {
		overflow: hidden;
		font-size: 0.95rem;
		font-style: italic;
		color: var(--muted);
		text-overflow: ellipsis;
		white-space: nowrap;
	}
	#toc { display: none; }
	#toc[open] {
		position: fixed;
		inset: 0 auto 0 0;
		display: flex;
		flex-direction: column;
		width: min(20rem, 85vw);
		height: 100dvh;
		max-height: 100dvh;
		padding: 0;
		border-right: 1px solid var(--rule);
		overflow: hidden;
		transform: translateX(-100%);
		transition: transform 0.22s ease;
	}
	#toc[open].in { transform: none; }
	#toc::backdrop { background: rgba(0, 0, 0, 0.45); }
	#tochead {
		flex: none;
		margin: 0;
		padding: 1rem 1.1rem 0.9rem;
		border-bottom: 1px solid var(--rule);
	}
	#toc #close { display: flex; }
	#list {
		flex: 1 1 auto;
		margin: 0;
		padding: 1rem 1.1rem;
		overflow-y: auto;
		overscroll-behavior: contain;
	}
	#empty { margin: 0; padding: 0 1.1rem 1rem; }
	#tools {
		flex: none;
		margin: 0;
		padding: 1.1rem 1.1rem calc(1.1rem + env(safe-area-inset-bottom));
		border-top: 1px solid var(--rule);
	}
	#night {
		top: 0.6rem;
		right: 1.1rem;
		z-index: 6;
	}
	body.locked { overflow: hidden; }
	main { padding: 4vh 6vw 12vh; }
}
@media (prefers-reduced-motion: reduce) {
	#toc[open] {
		transform: none;
		transition: none;
	}
}
</style>
</head>
<body>
<header id="bar">
	<button id="menu" type="button" aria-expanded="false" aria-controls="toc"><span aria-hidden="true">☰</span> Рассказы</button>
	<span id="barTitle"></span>
</header>
<dialog id="toc" aria-label="Список рассказов">
	<div id="tochead">
		<h2>Рассказы</h2>
		<button id="close" type="button" aria-label="Закрыть меню"><span aria-hidden="true">✕</span></button>
		<input id="filter" type="search" autocomplete="off" placeholder="Поиск…" aria-label="Поиск рассказа">
	</div>
	<ol id="list"></ol>
	<p id="empty" hidden>Ничего не найдено</p>
	<div id="tools">
		<select id="face"></select>
		<button class="act" type="button" id="random">Случайный рассказ</button>
		<button class="act" type="button" id="free">Свободная практика</button>
	</div>
</dialog>
<main>
	<h1 id="title"></h1>
	<p class="sub" id="sub"></p>
	<div id="editor" hidden>
		<textarea id="draft" spellcheck="false" placeholder="Вставьте или напишите текст…"></textarea>
		<nav><button class="act" type="button" id="render">Показать</button></nav>
	</div>
	<ol id="lines"></ol>
	<nav id="controls">
		<button class="act" type="button" id="all"></button>
		<button class="act" type="button" id="edit" hidden>Изменить текст</button>
	</nav>
</main>
<button id="night" type="button" title="Ночной режим">☾</button>

		{

			s: [

				["Там всегда много людей.", "There are always a lot of people there."],

		},
		{

			s: [

				["Утром он говорит мне: «Вставай!»", "In the morning it says to me: “Get up!”"],
				["Я читаю новости в телефоне.", "I read the news on my phone."],
				["Там у меня есть словарь.", "I have a dictionary on it."],
				["Я учу русские слова в автобусе.", "I learn Russian words on the bus."],
				["Вечером я звоню маме.", "In the evening I call my mum."],
				["Мы говорим двадцать минут.", "We talk for twenty minutes."]
			]
		},
		{
			t: "Кино",
			e: "The cinema",
			s: [
				["В пятницу мы идём в кино.", "On Friday we go to the cinema."],
				["Билет стоит четыреста рублей.", "A ticket costs four hundred roubles."],
				["Мы покупаем попкорн и воду.", "We buy popcorn and water."],
				["Сегодня новый русский фильм.", "Today there is a new Russian film."],
				["Я понимаю не все слова.", "I don’t understand all the words."],
				["Но фильм очень интересный.", "But the film is very interesting."],
				["Потом мы говорим о нём в кафе.", "Afterwards we talk about it in a café."]
			]
		},
		{
			t: "Работа дома",
			e: "Working from home",
			s: [
				["Я работаю дома.", "I work at home."],
				["Мой стол стоит у окна.", "My desk is by the window."],
				["Утром я пью кофе и читаю почту.", "In the morning I drink coffee and read my mail."],
				["В час я обедаю на кухне.", "At one o’clock I have lunch in the kitchen."],
				["Днём я много пишу.", "In the afternoon I write a lot."],
				["В шесть часов я закрываю компьютер.", "At six o’clock I close my computer."],
				["Потом я отдыхаю.", "Then I rest."]
			]
		},
		{
			t: "Бабушка",
			e: "Grandmother",
			s: [
				["Моя бабушка живёт в деревне.", "My grandmother lives in a village."],
				["Ей семьдесят восемь лет.", "She is seventy-eight years old."],
				["У неё маленький дом и сад.", "She has a small house and a garden."],
				["Она очень хорошо готовит.", "She cooks very well."],
				["Её пироги самые вкусные.", "Her pies are the tastiest."],
				["Мы приезжаем к ней каждое лето.", "We come to see her every summer."],
				["Она всегда очень рада.", "She is always very glad."]
			]
		},
		{
			t: "Музыка",
			e: "Music",
			s: [
				["Я очень люблю музыку.", "I love music very much."],
				["Дома я слушаю радио.", "At home I listen to the radio."],
				["В машине я слушаю старые песни.", "In the car I listen to old songs."],
				["Моя сестра играет на гитаре.", "My sister plays the guitar."],
				["Иногда мы поём вместе.", "Sometimes we sing together."],
				["Это плохо, но весело.", "It is bad, but it is fun."],
				["Соседи ничего не говорят.", "The neighbours don’t say anything."]
			]
		},
		{
			t: "Наш город",
			e: "Our town",
			s: [
				["Я живу в небольшом городе.", "I live in a small town."],
				["Здесь есть река и старый мост.", "There is a river and an old bridge here."],
				["В центре большая площадь.", "In the centre there is a big square."],
				["Там стоит красивая церковь.", "A beautiful church stands there."],
				["Летом на площади играет музыка.", "In summer music plays on the square."],
				["Мы гуляем и едим мороженое.", "We walk around and eat ice cream."],
				["Я не хочу жить в другом месте.", "I don’t want to live anywhere else."]
			]
		},
		{
			t: "Завтрак",
			e: "Breakfast",
			s: [
				["Я всегда завтракаю дома.", "I always have breakfast at home."],
				["Обычно я ем кашу.", "Usually I eat porridge."],

				["В восемь часов мы уже на улице.", "At eight o’clock we are already outside."]

		},
		{
			t: "Гости",
			e: "Guests",
			s: [
				["Сегодня к нам приходят гости.", "Today guests are coming to our place."],

				["Муж покупает хлеб и торт.", "My husband buys bread and cake."],

				["Это Анна и Сергей.", "It is Anna and Sergei."],
				["Мы сидим на кухне и говорим.", "We sit in the kitchen and talk."],
				["Они уходят очень поздно.", "They leave very late."]
			]
		},
		{
			t: "Ёжик Жора",
			e: "Zhora the hedgehog",
			s: [
				["В лесу живёт маленький ёжик.", "A little hedgehog lives in the forest."],
				["Его зовут Жора.", "His name is Zhora."],
				["Каждый день Жора ищет жуков.", "Every day Zhora looks for beetles."],
				["Он тоже любит жёлтые яблоки.", "He also likes yellow apples."],
				["Вечером ёжик лежит под деревом и ждёт дождя.", "In the evening the hedgehog lies under a tree and waits for the rain."],
				["Идёт дождь, и ёжик бежит домой.", "The rain comes, and the hedgehog runs home."],
				["Дома его уже ждёт ужин.", "Dinner is already waiting for him at home."]
			]
		}
	];
	var FACES = [
		{ n: "Pacifico", s: 1.5 },
		{ n: "Bad Script", s: 1.8 },
		{ n: "Caveat", s: 2.15 },
		{ n: "Marck Script", s: 1.75 }
	];
	var LABELS = ["Показать текст", "Показать перевод", "Скрыть всё"];
	var FREE_LABELS = ["Показать текст", "Скрыть текст"];
	var freeMode = false;
	var face = FACES[0];
	var current = 0;
	var gstage = 0;

	var list = document.getElementById("list");
	var title = document.getElementById("title");
	var sub = document.getElementById("sub");
	var lines = document.getElementById("lines");
	var all = document.getElementById("all");
	var sel = document.getElementById("face");
	var moon = document.getElementById("night");
	var editor = document.getElementById("editor");
	var draft = document.getElementById("draft");
	var controls = document.getElementById("controls");
	var editBtn = document.getElementById("edit");
	var freeBtn = document.getElementById("free");
	var toc = document.getElementById("toc");
	var menu = document.getElementById("menu");
	var barTitle = document.getElementById("barTitle");
	var filter = document.getElementById("filter");
	var empty = document.getElementById("empty");
	var closeBtn = document.getElementById("close");
	var tocItems = [];
	var mq = window.matchMedia("(max-width: 44rem)");

	function save(k, v) {
		try {
			localStorage.setItem(k, v);
		} catch (e) {}
	}

	function load(k) {
		try {
			return localStorage.getItem(k);
		} catch (e) {
			return null;
		}
	}

	function applyFace() {
		var stack = '"' + face.n + '", cursive';
		title.style.fontFamily = stack;
		title.style.fontSize = (face.s * 1.5).toFixed(2) + "rem";
		Array.prototype.forEach.call(document.querySelectorAll(".cur"), function (c) {
			c.style.fontFamily = stack;
			c.style.fontSize = face.s + "rem";
		});
	}

	function buildToc() {
		STORIES.forEach(function (story, i) {
			var li = document.createElement("li");
			var b = document.createElement("button");
			b.type = "button";
			b.appendChild(document.createTextNode(story.t));
			var sm = document.createElement("small");
			sm.textContent = story.e;
			b.appendChild(sm);
			b.addEventListener("click", function () {
				show(i);
				drawerClose(false);
			});
			li.appendChild(b);
			list.appendChild(li);
			tocItems.push(li);
		});
	}

	function norm(s) {
		return s.toLowerCase().replace(/ё/g, "е");
	}

	function applyFilter() {
		var q = norm(filter.value.trim());
		var hits = 0;
		tocItems.forEach(function (li, i) {
			var s = STORIES[i];
			var hit = !q || norm(s.t).indexOf(q) > -1 || norm(s.e).indexOf(q) > -1;
			li.hidden = !hit;
			if (hit) {
				hits++;
			}
		});
		empty.hidden = hits > 0;
	}

	function syncRole() {
		if (mq.matches) {
			toc.removeAttribute("role");
		} else {
			toc.setAttribute("role", "navigation");
		}
	}

	function drawerOpen() {
		if (!mq.matches || toc.open) {
			return;
		}
		filter.value = "";
		applyFilter();
		toc.showModal();
		document.body.classList.add("locked");
		menu.setAttribute("aria-expanded", "true");
		window.requestAnimationFrame(function () {
			toc.classList.add("in");
		});
	}

	function drawerClose(returnFocus, after) {
		if (!toc.open) {
			if (after) {
				after();
			}
			return;
		}
		toc.classList.remove("in");
		menu.setAttribute("aria-expanded", "false");
		document.body.classList.remove("locked");
		window.setTimeout(function () {
			if (toc.open) {
				toc.close();
			}
			if (returnFocus) {
				menu.focus();
			}
			if (after) {
				after();
			}
		}, 220);
	}

	function markToc() {
		Array.prototype.forEach.call(list.querySelectorAll("button"), function (b, i) {
			b.setAttribute("aria-current", !freeMode && i === current ? "true" : "false");
		});
		freeBtn.setAttribute("aria-current", freeMode ? "true" : "false");
	}

	function show(i) {
		freeMode = false;
		current = i;
		gstage = 0;
		editor.hidden = true;
		controls.hidden = false;
		editBtn.hidden = true;
		all.hidden = false;
		var story = STORIES[i];
		document.title = story.t + " — Рассказы";
		title.textContent = story.t;
		barTitle.textContent = story.t;
		sub.textContent = story.e;
		lines.textContent = "";
		all.textContent = LABELS[0];

		story.s.forEach(function (pair) {
			var li = document.createElement("li");
			li.setAttribute("data-stage", "0");
			var b = document.createElement("button");
			b.className = "ru";
			b.type = "button";
			var cur = document.createElement("span");
			cur.className = "cur";
			cur.textContent = pair[0];
			var prn = document.createElement("span");
			prn.className = "prn";
			prn.textContent = pair[0];
			b.appendChild(cur);
			b.appendChild(prn);
			var en = document.createElement("p");
			en.className = "en";
			en.textContent = pair[1];
			b.addEventListener("click", function () {
				var n = (parseInt(li.getAttribute("data-stage"), 10) + 1) % 3;
				li.setAttribute("data-stage", String(n));
			});
			li.appendChild(b);
			li.appendChild(en);
			lines.appendChild(li);
		});

		markToc();
		applyFace();
		save("story", String(i));
		window.scrollTo(0, 0);
	}

	function splitText(t) {
		var out = [];
		t.split(/\n+/).forEach(function (para) {
			(para.match(/[^.!?…]+[.!?…]*/g) || []).forEach(function (c) {
				c = c.trim();
				if (c) {
					out.push(c);
				}
			});
		});
		return out;
	}

	function renderFree(text) {
		save("free", text);
		gstage = 0;
		editor.hidden = true;
		controls.hidden = false;
		all.hidden = false;
		editBtn.hidden = false;
		all.textContent = FREE_LABELS[0];
		lines.textContent = "";

		splitText(text).forEach(function (s) {
			var li = document.createElement("li");
			li.setAttribute("data-stage", "0");
			var b = document.createElement("button");
			b.className = "ru";
			b.type = "button";
			var cur = document.createElement("span");
			cur.className = "cur";
			cur.textContent = s;
			var prn = document.createElement("span");
			prn.className = "prn";
			prn.textContent = s;
			b.appendChild(cur);
			b.appendChild(prn);
			b.addEventListener("click", function () {
				var n = (parseInt(li.getAttribute("data-stage"), 10) + 1) % 2;
				li.setAttribute("data-stage", String(n));
			});
			li.appendChild(b);
			lines.appendChild(li);
		});

		applyFace();
	}

	function showFree(edit) {
		freeMode = true;
		current = -1;
		document.title = "Свободная практика — Рассказы";
		title.textContent = "Свободная практика";
		barTitle.textContent = "Свободная практика";
		sub.textContent = "Free practice";
		markToc();
		save("story", "free");
		var text = load("free") || "";
		draft.value = text;

		if (edit || !text.trim()) {
			lines.textContent = "";
			editor.hidden = false;
			controls.hidden = true;
			draft.focus();
		} else {
			renderFree(text);
		}

		applyFace();
		window.scrollTo(0, 0);
	}

	all.addEventListener("click", function () {
		var labels = freeMode ? FREE_LABELS : LABELS;
		gstage = (gstage + 1) % labels.length;
		Array.prototype.forEach.call(lines.querySelectorAll("li"), function (li) {
			li.setAttribute("data-stage", String(gstage));
		});
		all.textContent = labels[gstage];
	});

	freeBtn.addEventListener("click", function () {
		drawerClose(false, function () {
			showFree(true);
		});
	});

	editBtn.addEventListener("click", function () {
		showFree(true);
	});

	document.getElementById("render").addEventListener("click", function () {
		if (draft.value.trim()) {
			renderFree(draft.value);
			window.scrollTo(0, 0);
		}
	});

	draft.addEventListener("keydown", function (e) {
		if ((e.metaKey || e.ctrlKey) && e.key === "Enter" && draft.value.trim()) {
			renderFree(draft.value);
			window.scrollTo(0, 0);
		}
	});

	document.getElementById("random").addEventListener("click", function () {
		var i = Math.floor(Math.random() * STORIES.length);
		while (STORIES.length > 1 && i === current) {
			i = Math.floor(Math.random() * STORIES.length);
		}
		show(i);
		drawerClose(false);
	});

	menu.addEventListener("click", drawerOpen);

	closeBtn.addEventListener("click", function () {
		drawerClose(true);
	});

	toc.addEventListener("cancel", function (e) {
		e.preventDefault();
		drawerClose(true);
	});

	toc.addEventListener("click", function (e) {
		if (e.target === toc) {
			drawerClose(true);
		}
	});

	filter.addEventListener("input", applyFilter);

	var tx = 0;
	var ty = 0;
	toc.addEventListener("touchstart", function (e) {
		tx = e.changedTouches[0].clientX;
		ty = e.changedTouches[0].clientY;
	}, { passive: true });
	toc.addEventListener("touchend", function (e) {
		var dx = e.changedTouches[0].clientX - tx;
		var dy = e.changedTouches[0].clientY - ty;
		if (dx < -50 && Math.abs(dx) > Math.abs(dy)) {
			drawerClose(true);
		}
	}, { passive: true });

	mq.addEventListener("change", function () {
		syncRole();
		if (!mq.matches && toc.open) {
			toc.classList.remove("in");
			document.body.classList.remove("locked");
			menu.setAttribute("aria-expanded", "false");
			toc.close();
		}
	});

	FACES.forEach(function (f) {
		var o = document.createElement("option");
		o.value = f.n;
		o.textContent = f.n;
		sel.appendChild(o);
	});
	sel.addEventListener("change", function () {
		FACES.forEach(function (f) {
			if (f.n === sel.value) {
				face = f;
			}
		});
		save("face", face.n);
		applyFace();
	});

	moon.addEventListener("click", function () {
		var on = !document.body.classList.contains("night");
		document.body.classList.toggle("night", on);
		moon.textContent = on ? "☀" : "☾";
		save("night", on ? "1" : "0");
	});

	var savedFace = load("face");
	FACES.forEach(function (f) {
		if (f.n === savedFace) {
			face = f;
		}
	});
	sel.value = face.n;
	if (load("night") === "1") {
		document.body.classList.add("night");
		moon.textContent = "☀";
	}

	syncRole();
	buildToc();
	var savedStory = load("story");
	if (savedStory === "free") {
		showFree(false);
	} else {
		var n = parseInt(savedStory, 10);
		show(isNaN(n) || n < 0 || n >= STORIES.length ? 0 : n);
	}
})();
</script>

</html>
